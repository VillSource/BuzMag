opencollection: 1.0.0

info:
  name: SandBox
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{baseUrl}}/connect/authorize"
    accessTokenUrl: "{{baseUrl}}/connect/token"
    credentials:
      clientId: bruno
      placement: body
    scope: openid profile offline_access roles
    pkce: {}
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
