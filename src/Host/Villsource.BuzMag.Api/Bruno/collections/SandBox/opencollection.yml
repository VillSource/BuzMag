opencollection: 1.0.0

info:
  name: SandBox
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{baseUrl}}/connect/authorize"
    accessTokenUrl: "{{baseUrl}}/connect/token"
    credentials:
      clientId: root-elsa-studio
      placement: body
    additionalParameters:
      authorizationRequest:
        - name: response_mode
          placement: query
          value: form_post
    scope: openid profile roles
    pkce: {}
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
