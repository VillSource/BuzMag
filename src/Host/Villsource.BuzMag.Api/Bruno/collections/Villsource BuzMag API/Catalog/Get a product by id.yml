info:
  name: Get a product by id
  type: http
  seq: 22
  tags:
    - Catalog

http:
  method: GET
  url: "{{baseUrl}}/api/v1/catalog/products/:productId"
  params:
    - name: productId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/catalog/products/:productId"
      method: GET
      params:
        - name: productId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "sku": "",
            "name": "",
            "slug": "",
            "description": "",
            "brandId": "",
            "categoryId": "",
            "price": {
              "amount": "",
              "currency": ""
            },
            "stock": "",
            "isActive": false,
            "thumbnailUrl": "",
