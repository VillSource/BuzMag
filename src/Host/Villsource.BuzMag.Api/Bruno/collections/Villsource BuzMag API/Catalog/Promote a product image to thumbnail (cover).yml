info:
  name: Promote a product image to thumbnail (cover)
  type: http
  seq: 27
  tags:
    - Catalog

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/catalog/products/:productId/images/:imageId/thumbnail"
  params:
    - name: productId
      value: ""
      type: path
    - name: imageId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

