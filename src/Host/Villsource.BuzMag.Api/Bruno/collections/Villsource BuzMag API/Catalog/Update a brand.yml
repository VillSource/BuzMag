info:
  name: Update a brand
  type: http
  seq: 5
  tags:
    - Catalog

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/catalog/brands/:brandId"
  params:
    - name: brandId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "brandId": "",
        "name": "",
        "description": "",
        "logoUrl": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
