info:
  name: Attach an image to a product
  type: http
  seq: 25
  tags:
    - Catalog

http:
  method: POST
  url: "{{baseUrl}}/api/v1/catalog/products/:productId/images"
  params:
    - name: productId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "fileAssetId": "",
        "url": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/catalog/products/:productId/images"
      method: POST
      params:
        - name: productId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "fileAssetId": "",
            "url": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "fileAssetId": "",
            "url": "",
            "isThumbnail": false,
            "sortOrder": "",
            "createdAtUtc": ""
          }
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/api/v1/catalog/products/:productId/images"
      method: POST
      params:
        - name: productId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "fileAssetId": "",
            "url": ""
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
