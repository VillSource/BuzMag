info:
  name: Get a brand by id
  type: http
  seq: 7
  tags:
    - Catalog

http:
  method: GET
  url: "{{baseUrl}}/api/v1/catalog/brands/:brandId"
  params:
    - name: brandId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
