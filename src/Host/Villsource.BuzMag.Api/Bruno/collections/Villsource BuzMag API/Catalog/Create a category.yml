info:
  name: Create a category
  type: http
  seq: 11
  tags:
    - Catalog

http:
  method: POST
  url: "{{baseUrl}}/api/v1/catalog/categories"
  body:
    type: json
    data: |-
      {
        "name": "",
        "description": "",
        "parentCategoryId": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
