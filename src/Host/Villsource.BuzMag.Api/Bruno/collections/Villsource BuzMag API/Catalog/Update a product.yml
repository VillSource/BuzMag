info:
  name: Update a product
  type: http
  seq: 20
  tags:
    - Catalog

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/catalog/products/:productId"
  params:
    - name: productId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "productId": "",
        "name": "",
        "description": "",
        "brandId": "",
        "categoryId": "",
        "isActive": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/catalog/products/:productId"
      method: PUT
      params:
        - name: productId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "productId": "",
            "name": "",
            "description": "",
            "brandId": "",
            "categoryId": "",
            "isActive": false
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
