info:
  name: List billing plans
  type: http
  seq: 1
  tags:
    - Billing

http:
  method: GET
  url: "{{baseUrl}}/api/v1/billing/plans"
  params:
    - name: includeInactive
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/billing/plans"
      method: GET
      params:
        - name: includeInactive
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "key": "",
              "name": "",
              "currency": "",
              "monthlyBasePrice": "",
              "overageRates": {},
              "isActive": false,
              "interval": "Monthly",
              "annualPrice": ""
            }
          ]
