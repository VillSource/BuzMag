info:
  name: List invoices for the current tenant
  type: http
  seq: 8
  tags:
    - Billing

http:
  method: GET
  url: "{{baseUrl}}/api/v1/billing/invoices/me"
  params:
    - name: status
      value: Draft
      type: query
      disabled: true
    - name: status
      value: Issued
      type: query
      disabled: true
    - name: status
      value: Paid
      type: query
      disabled: true
    - name: status
      value: Void
      type: query
      disabled: true
    - name: periodYear
      value: ""
      type: query
      disabled: true
    - name: periodMonth
      value: ""
      type: query
      disabled: true
    - name: pageNumber
      value: ""
      type: query
    - name: pageSize
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
