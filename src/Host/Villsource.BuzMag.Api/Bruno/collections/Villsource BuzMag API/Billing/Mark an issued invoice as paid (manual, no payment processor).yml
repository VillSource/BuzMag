info:
  name: Mark an issued invoice as paid (manual, no payment processor)
  type: http
  seq: 13
  tags:
    - Billing

http:
  method: POST
  url: "{{baseUrl}}/api/v1/billing/invoices/:invoiceId/pay"
  params:
    - name: invoiceId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/billing/invoices/:invoiceId/pay"
      method: POST
      params:
        - name: invoiceId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
