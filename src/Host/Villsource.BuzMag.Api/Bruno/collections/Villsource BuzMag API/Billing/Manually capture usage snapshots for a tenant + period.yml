info:
  name: Manually capture usage snapshots for a tenant + period
  type: http
  seq: 16
  tags:
    - Billing

http:
  method: POST
  url: "{{baseUrl}}/api/v1/billing/usage/snapshots/capture"
  body:
    type: json
    data: |-
      {
        "tenantId": "",
        "periodYear": "",
        "periodMonth": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/billing/usage/snapshots/capture"
      method: POST
      body:
        type: json
        data: |-
          {
            "tenantId": "",
            "periodYear": "",
            "periodMonth": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "tenantId": "",
              "periodYear": "",
              "periodMonth": "",
              "resource": "ApiCalls",
              "usedUnits": "",
              "limitUnits": "",
              "overage": "",
              "capturedAtUtc": ""
            }
          ]
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/api/v1/billing/usage/snapshots/capture"
      method: POST
      body:
        type: json
        data: |-
          {
            "tenantId": "",
            "periodYear": "",
            "periodMonth": ""
          }
    response:
      status: 400
