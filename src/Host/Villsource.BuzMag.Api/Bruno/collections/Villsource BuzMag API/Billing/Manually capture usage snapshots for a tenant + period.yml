      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/billing/usage/snapshots/capture"
      method: POST
      body:
        type: json
        data: |-
          {
            "tenantId": "",
            "periodYear": "",
            "periodMonth": ""
