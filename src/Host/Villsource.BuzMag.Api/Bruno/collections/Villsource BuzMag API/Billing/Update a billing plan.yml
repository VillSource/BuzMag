info:
  name: Update a billing plan
  type: http
  seq: 3
  tags:
    - Billing

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/billing/plans/:planId"
  params:
    - name: planId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "planId": "",
        "name": "",
        "monthlyBasePrice": "",
        "overageRates": "",
        "interval": "Monthly",
        "annualPrice": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/billing/plans/:planId"
      method: PUT
      params:
        - name: planId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "planId": "",
            "name": "",
            "monthlyBasePrice": "",
            "overageRates": "",
            "interval": "Monthly",
            "annualPrice": ""
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
