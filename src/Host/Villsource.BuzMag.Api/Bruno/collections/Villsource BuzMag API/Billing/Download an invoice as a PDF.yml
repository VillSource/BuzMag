info:
  name: Download an invoice as a PDF
  type: http
  seq: 10
  tags:
    - Billing

http:
  method: GET
  url: "{{baseUrl}}/api/v1/billing/invoices/:invoiceId/pdf"
  params:
    - name: invoiceId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/billing/invoices/:invoiceId/pdf"
      method: GET
      params:
        - name: invoiceId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/api/v1/billing/invoices/:invoiceId/pdf"
      method: GET
      params:
        - name: invoiceId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
