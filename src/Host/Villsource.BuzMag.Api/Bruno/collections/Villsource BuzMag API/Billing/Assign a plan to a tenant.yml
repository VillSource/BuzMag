info:
  name: Assign a plan to a tenant
  type: http
  seq: 5
  tags:
    - Billing

http:
  method: POST
  url: "{{baseUrl}}/api/v1/billing/subscriptions"
  body:
    type: json
    data: |-
      {
        "tenantId": "",
        "planKey": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

