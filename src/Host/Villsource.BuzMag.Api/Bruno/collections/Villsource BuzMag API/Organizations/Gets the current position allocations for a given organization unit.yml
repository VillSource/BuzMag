info:
  name: Gets the current position allocations for a given organization unit
  type: http
  seq: 11
  tags:
    - Organizations

http:
  method: GET
  url: "{{baseUrl}}/api/v1/organizations/units/:organizationUnitId/positions"
  params:
    - name: organizationUnitId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/organizations/units/:organizationUnitId/positions"
      method: GET
      params:
        - name: organizationUnitId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
