info:
  name: Get all positions from specified organization
  type: http
  seq: 10
  tags:
    - Organizations

http:
  method: GET
  url: "{{baseUrl}}/api/v1/organizations/:organizationId/positions"
  params:
    - name: organizationId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/organizations/:organizationId/positions"
