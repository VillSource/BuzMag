info:
  name: Update a position
  type: http
  seq: 9
  tags:
    - Organizations

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/organizations/positions/:positionId"
  params:
    - name: positionId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "code": "",
        "name": "",
        "description": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
