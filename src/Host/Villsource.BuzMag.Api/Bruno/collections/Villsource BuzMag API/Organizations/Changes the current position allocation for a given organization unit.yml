info:
  name: Changes the current position allocation for a given organization unit
  type: http
  seq: 14
  tags:
    - Organizations

http:
  method: POST
  url: "{{baseUrl}}/api/v1/organizations/position-allocations/:allocationId/change"
  params:
    - name: allocationId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "headCount": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
