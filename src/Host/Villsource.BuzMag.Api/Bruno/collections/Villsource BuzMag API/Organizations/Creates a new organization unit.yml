info:
  name: Creates a new organization unit
  type: http
  seq: 3
  tags:
    - Organizations

http:
  method: POST
  url: "{{baseUrl}}/api/v1/organizations/units"
  body:
    type: json
    data: |-
      {
        "code": "",
        "name": "",
        "description": "",
        "parentId": "",
        "organizationId": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

