info:
  name: Issue a short-lived SSE stream token
  type: http
  seq: 1
  tags:
    - SSE

http:
  method: POST
  url: "{{baseUrl}}/api/v1/sse/token"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/sse/token"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
