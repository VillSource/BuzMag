info:
  name: Quick process liveness probe
  type: http
  seq: 1
  tags:
    - Health

http:
  method: GET
  url: "{{baseUrl}}/health/live"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/health/live"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "",
            "results": [
              {
                "name": "",
                "status": "",
                "description": "",
                "durationMs": "",
                "details": ""
              }
            ]
          }

docs: Reports if the API process is alive. Does not check dependencies.
