info:
  name: Send a message to a channel — supports replies (parentMessageId) and attachments
  type: http
  seq: 13
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/api/v1/chat/channels/:id/messages"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "body": "",
        "parentMessageId": "",
        "attachments": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

