info:
  name: Rename / re-describe / re-privacy a named channel (channel admin only)
  type: http
  seq: 9
  tags:
    - Chat

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/chat/channels/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "description": "",
        "isPrivate": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/chat/channels/:id"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "name": "",
            "description": "",
            "isPrivate": false
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
