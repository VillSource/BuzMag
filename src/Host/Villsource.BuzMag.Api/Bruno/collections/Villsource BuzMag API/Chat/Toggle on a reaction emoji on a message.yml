info:
  name: Toggle on a reaction emoji on a message
  type: http
  seq: 20
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/api/v1/chat/messages/:id/reactions"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "emoji": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/chat/messages/:id/reactions"
