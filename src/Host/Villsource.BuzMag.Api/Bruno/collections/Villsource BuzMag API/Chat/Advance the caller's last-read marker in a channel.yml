info:
  name: Advance the caller's last-read marker in a channel
  type: http
  seq: 8
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/api/v1/chat/channels/:id/read"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "messageId": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
