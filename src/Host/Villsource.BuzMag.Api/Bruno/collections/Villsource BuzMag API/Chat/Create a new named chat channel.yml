info:
  name: Create a new named chat channel
  type: http
  seq: 2
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/api/v1/chat/channels"
  body:
    type: json
    data: |-
      {
        "name": "",
        "description": "",
        "isPrivate": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/chat/channels"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "description": "",
            "isPrivate": false
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
