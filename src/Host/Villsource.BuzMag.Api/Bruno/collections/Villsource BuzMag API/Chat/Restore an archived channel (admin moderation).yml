info:
  name: Restore an archived channel (admin moderation)
  type: http
  seq: 5
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/api/v1/chat/channels/:id/restore"
  params:
    - name: id
      value: ""
      type: path
