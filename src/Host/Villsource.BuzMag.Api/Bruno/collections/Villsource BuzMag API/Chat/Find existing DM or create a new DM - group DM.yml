info:
  name: Find existing DM or create a new DM / group DM
  type: http
  seq: 4
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/api/v1/chat/dms"
  body:
    type: json
    data: |-
      {
        "userIds": []
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/chat/dms"
      method: POST
      body:
        type: json
        data: |-
          {
            "userIds": []
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
