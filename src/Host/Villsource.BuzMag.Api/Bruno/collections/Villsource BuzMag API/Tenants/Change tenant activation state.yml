info:
  name: Change tenant activation state
  type: http
  seq: 1
  tags:
    - Tenants

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tenants/:id/activation"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "tenantId": "",
        "isActive": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

