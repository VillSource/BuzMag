        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "tenantId": "",
            "planKey": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "tenantId": "",
            "validUpto": "",
            "planKey": "",
            "planChanged": false
          }
  - name: 400 Response
