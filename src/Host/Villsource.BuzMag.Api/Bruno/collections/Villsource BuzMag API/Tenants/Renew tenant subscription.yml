info:
  name: Renew tenant subscription
  type: http
  seq: 4
  tags:
    - Tenants

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tenants/:id/renew"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "tenantId": "",
        "planKey": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
