  type: http
  seq: 8
  tags:
    - Tenants

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenants/:tenantId/provisioning"
  params:
    - name: tenantId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
