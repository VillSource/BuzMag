info:
  name: Create tenant
  type: http
  seq: 3
  tags:
    - Tenants

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tenants"
  body:
    type: json
    data: |-
      {
        "id": "",
        "name": "",
        "connectionString": "",
        "adminEmail": "",
        "adminPassword": "",
        "issuer": "",
        "planKey": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

