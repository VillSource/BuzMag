  type: http
  seq: 2
  tags:
    - Tenants

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenants"
  params:
    - name: PageNumber
      value: ""
      type: query
      disabled: true
    - name: PageSize
      value: ""
      type: query
      disabled: true
    - name: Sort
      value: ""
      type: query
      disabled: true
