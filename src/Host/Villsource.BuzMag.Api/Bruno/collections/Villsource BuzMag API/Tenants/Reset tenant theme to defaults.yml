info:
  name: Reset tenant theme to defaults
  type: http
  seq: 13
  tags:
    - Tenants

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tenants/theme/reset"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{baseUrl}}/api/v1/tenants/theme/reset"
      method: POST
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/tenants/theme/reset"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/api/v1/tenants/theme/reset"
      method: POST
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""

docs: Reset the theme settings for the current tenant to the default values.
