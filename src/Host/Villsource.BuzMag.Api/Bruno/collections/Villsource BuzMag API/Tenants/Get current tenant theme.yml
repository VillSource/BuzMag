info:
  name: Get current tenant theme
  type: http
  seq: 11
  tags:
    - Tenants

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenants/theme"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/tenants/theme"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "lightPalette": {
              "primary": "",
              "secondary": "",
              "tertiary": "",
              "background": "",
              "surface": "",
              "error": "",
              "warning": "",
              "success": "",
              "info": ""
            },
            "darkPalette": {
              "primary": "",
              "secondary": "",
              "tertiary": "",
              "background": "",
              "surface": "",
              "error": "",
              "warning": "",
              "success": "",
              "info": ""
            },
            "brandAssets": {
              "logoUrl": "",
              "logoDarkUrl": "",
              "faviconUrl": "",
              "logo": "",
              "logoDark": "",
              "favicon": "",
              "deleteLogo": false,
              "deleteLogoDark": false,
              "deleteFavicon": false
            },
            "typography": {
              "fontFamily": "",
              "headingFontFamily": "",
              "fontSizeBase": "",
              "lineHeightBase": ""
            },
            "layout": {
              "borderRadius": "",
              "defaultElevation": ""
            },
            "isDefault": false
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/tenants/theme"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/api/v1/tenants/theme"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""

docs: Retrieve the theme settings for the current tenant, including colors, typography, and brand assets.
