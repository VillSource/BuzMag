info:
  name: Get the calling tenant's status
  type: http
  seq: 7
  tags:
    - Tenants

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenants/me/status"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/tenants/me/status"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "isActive": false,
            "validUpto": "",
            "hasConnectionString": false,
            "adminEmail": "",
            "issuer": "",
            "plan": "",
            "expiryState": "",
            "graceEndsUtc": ""
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/tenants/me/status"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

docs: Returns plan, validity, and expiry/grace state for the authenticated tenant — used by the tenant dashboard to show plan info and expiry warnings.
