info:
  name: Create a webhook subscription
  type: http
  seq: 1
  tags:
    - Webhooks

http:
  method: POST
  url: "{{baseUrl}}/api/v1/webhooks/subscriptions"
  body:
    type: json
    data: |-
      {
        "url": "",
        "events": [],
        "secret": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/api/v1/webhooks/subscriptions"
      method: POST
      body:
        type: json
        data: |-
          {
            "url": "",
            "events": [],
            "secret": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
