info:
  name: Update role permissions
  type: http
  seq: 8
  tags:
    - Identity

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/identity/:id/permissions"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "roleId": "",
        "permissions": []
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

