info:
  name: Start user impersonation
  type: http
  seq: 45
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/impersonation/start"
  body:
    type: json
    data: |-
      {
        "targetUserId": "",
        "targetTenantId": "",
        "reason": "",
        "durationMinutes": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

