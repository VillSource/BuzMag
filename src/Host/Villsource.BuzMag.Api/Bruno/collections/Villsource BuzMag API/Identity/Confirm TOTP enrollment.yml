info:
  name: Confirm TOTP enrollment
  type: http
  seq: 50
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/2fa/verify"
  body:
    type: json
    data: |-
      {
        "code": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/identity/2fa/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "code": ""
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/api/v1/identity/2fa/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "code": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/identity/2fa/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "code": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

docs: Verifies the 6-digit code from the authenticator app. On success, 2FA is enabled and subsequent logins must include a code.
