info:
  name: Add users to a group
  type: http
  seq: 42
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/groups/:groupId/members"
  params:
    - name: groupId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "userIds": []
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

