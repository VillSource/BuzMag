info:
  name: Update user profile
  type: http
  seq: 21
  tags:
    - Identity

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/identity/profile"
  body:
    type: json
    data: |-
      {
        "id": "",
        "firstName": "",
        "lastName": "",
        "phoneNumber": "",
        "email": "",
        "image": "",
        "deleteCurrentImage": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
