info:
  name: Self register user
  type: http
  seq: 27
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/self-register"
  headers:
    - name: tenant
      value: ""
  body:
    type: json
    data: |-
      {
        "firstName": "",
        "lastName": "",
        "email": "",
        "userName": "",
        "password": "",
        "confirmPassword": "",
        "phoneNumber": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

