info:
  name: Assign roles to user
  type: http
  seq: 10
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/users/:id/roles"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "userId": "",
        "userRoles": [
          {
            "roleId": "",
            "roleName": "",
            "description": "",
            "enabled": false
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

