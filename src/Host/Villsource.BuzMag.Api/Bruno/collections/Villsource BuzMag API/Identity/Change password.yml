info:
  name: Change password
  type: http
  seq: 12
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/change-password"
  body:
    type: json
    data: |-
      {
        "password": "",
        "newPassword": "",
        "confirmNewPassword": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/identity/change-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "password": "",
            "newPassword": "",
            "confirmNewPassword": ""
          }
    response:
      status: 200
