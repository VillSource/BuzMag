info:
  name: Create or update role
  type: http
  seq: 4
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/roles"
  body:
    type: json
    data: |-
      {
        "id": "",
        "name": "",
        "description": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/identity/roles"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "description": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "description": "",
            "permissions": ""
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/identity/roles"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "description": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/api/v1/identity/roles"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "description": ""
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""

docs: Create a new role or update an existing role's name and description.
