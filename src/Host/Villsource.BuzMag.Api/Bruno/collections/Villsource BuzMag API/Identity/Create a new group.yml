  type: http
  seq: 37
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/groups"
  body:
    type: json
    data: |-
      {
        "name": "",
        "description": "",
        "isDefault": false,
        "roleIds": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
