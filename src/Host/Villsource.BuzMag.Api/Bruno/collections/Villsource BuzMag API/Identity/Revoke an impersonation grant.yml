info:
  name: Revoke an impersonation grant
  type: http
  seq: 48
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/impersonation/grants/:id/revoke"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: "{}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/identity/impersonation/grants/:id/revoke"
      method: POST
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: "{}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "jti": "",
            "actorUserId": "",
            "actorUserName": "",
            "actorTenantId": "",
            "impersonatedUserId": "",
            "impersonatedUserName": "",
            "impersonatedTenantId": "",
            "reason": "",
            "startedAtUtc": "",
            "expiresAtUtc": "",
            "endedAtUtc": "",
            "revokedAtUtc": "",
            "revokedByUserId": "",
            "revokedByUserName": "",
            "revokeReason": "",
            "status": "Active"
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/identity/impersonation/grants/:id/revoke"
      method: POST
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: "{}"
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/api/v1/identity/impersonation/grants/:id/revoke"
      method: POST
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: "{}"
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/api/v1/identity/impersonation/grants/:id/revoke"
      method: POST
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: "{}"
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Marks the grant as revoked. Subsequent requests carrying the impersonation token are rejected by the JWT validation hook within ~1 second (cache TTL).
