info:
  name: Begin TOTP enrollment
  type: http
  seq: 49
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/2fa/enroll"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/identity/2fa/enroll"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sharedKey": "",
            "authenticatorUri": ""
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/identity/2fa/enroll"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

docs: Generates (or rotates) the current user's authenticator shared secret and returns it plus an otpauth:// URI for QR rendering. 2FA is NOT enabled until the caller confirms with /2fa/verify.
