info:
  name: End user impersonation
  type: http
  seq: 46
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/impersonation/end"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/identity/impersonation/end"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accessToken": "",
            "refreshToken": "",
            "refreshTokenExpiresAt": "",
            "accessTokenExpiresAt": ""
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/api/v1/identity/impersonation/end"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/identity/impersonation/end"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

docs: Returns a fresh access + refresh token for the original actor based on the act_sub/act_tenant claims embedded in the impersonation token. Callable by any authenticated impersonation session.
