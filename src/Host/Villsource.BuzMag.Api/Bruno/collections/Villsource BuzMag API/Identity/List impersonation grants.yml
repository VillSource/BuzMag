info:
  name: List impersonation grants
  type: http
  seq: 47
  tags:
    - Identity

http:
  method: GET
  url: "{{baseUrl}}/api/v1/identity/impersonation/grants"
  params:
    - name: Status
      value: Active
      type: query
      disabled: true
    - name: Status
      value: Ended
      type: query
      disabled: true
    - name: Status
      value: Revoked
      type: query
      disabled: true
    - name: Status
      value: Expired
      type: query
      disabled: true
    - name: ImpersonatedTenantId
      value: ""
      type: query
      disabled: true
    - name: ActorUserId
      value: ""
      type: query
      disabled: true
    - name: Take
      value: "100"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

