info:
  name: Toggle user status
  type: http
  seq: 18
  tags:
    - Identity

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/identity/users/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "activateUser": false,
        "userId": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

