info:
  name: Get groups for a user
  type: http
  seq: 44
  tags:
    - Identity

http:
  method: GET
  url: "{{baseUrl}}/api/v1/identity/users/:userId/groups"
  params:
    - name: userId
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/identity/users/:userId/groups"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "description": "",
              "isDefault": false,
              "isSystemGroup": false,
              "memberCount": "",
              "roleIds": "",
              "roleNames": "",
              "createdAt": ""
            }
          ]
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/identity/users/:userId/groups"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
    response:
      status: 401
