info:
  name: Confirm a user's email (admin)
  type: http
  seq: 13
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/users/:id/confirm-email"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
