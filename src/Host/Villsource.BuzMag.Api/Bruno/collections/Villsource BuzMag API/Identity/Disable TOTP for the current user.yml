info:
  name: Disable TOTP for the current user
  type: http
  seq: 51
  tags:
    - Identity

http:
  method: POST
  url: "{{baseUrl}}/api/v1/identity/2fa/disable"
  body:
    type: json
    data: |-
      {
        "currentPassword": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/identity/2fa/disable"
      method: POST
      body:
        type: json
        data: |-
          {
            "currentPassword": ""
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/api/v1/identity/2fa/disable"
      method: POST
      body:
        type: json
        data: |-
          {
            "currentPassword": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/identity/2fa/disable"
      method: POST
      body:
        type: json
        data: |-
          {
            "currentPassword": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

docs: Turns off 2FA after confirming the current password. Also rotates the authenticator secret so a re-enroll starts fresh.
