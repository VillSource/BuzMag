          disabled: true
        - name: search
          value: ""
          type: query
          disabled: true
        - name: pageNumber
          value: ""
          type: query
          disabled: true
        - name: pageSize
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
