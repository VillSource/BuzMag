info:
  name: List all sessions in the current tenant (Admin)
  type: http
  seq: 32
  tags:
    - Identity

http:
  method: GET
  url: "{{baseUrl}}/api/v1/identity/sessions"
  params:
    - name: includeInactive
      value: ""
      type: query
      disabled: true
    - name: search
      value: ""
      type: query
      disabled: true
    - name: pageNumber
      value: ""
      type: query
      disabled: true
    - name: pageSize
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/identity/sessions"
