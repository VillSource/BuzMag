info:
  name: Count of caller's unread notifications (bell badge)
  type: http
  seq: 2
  tags:
    - Notifications

http:
  method: GET
  url: "{{baseUrl}}/api/v1/notifications/unread-count"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
