info:
  name: Mark every unread notification for the caller as read; returns the count updated
  type: http
  seq: 3
  tags:
    - Notifications

http:
  method: POST
  url: "{{baseUrl}}/api/v1/notifications/read-all"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
