info:
  name: Get audit events by correlation id
  type: http
  seq: 3
  tags:
    - Audits

http:
  method: GET
  url: "{{baseUrl}}/api/v1/audits/by-correlation/:correlationId"
  params:
    - name: correlationId
      value: ""
      type: path
    - name: fromUtc
      value: ""
      type: query
      disabled: true
    - name: toUtc
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/audits/by-correlation/:correlationId"
      method: GET
      params:
        - name: correlationId
          value: ""
          type: path
        - name: fromUtc
          value: ""
          type: query
          disabled: true
        - name: toUtc
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "occurredAtUtc": "",
              "eventType": "None",
              "severity": "None",
              "tenantId": "",
              "userId": "",
              "userName": "",
              "traceId": "",
              "correlationId": "",
              "requestId": "",
              "source": "",
              "tags": ""
            }
          ]
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/audits/by-correlation/:correlationId"
      method: GET
      params:
        - name: correlationId
          value: ""
          type: path
        - name: fromUtc
          value: ""
          type: query
          disabled: true
        - name: toUtc
          value: ""
          type: query
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
