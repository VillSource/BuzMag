info:
  name: Snapshot online status for a comma-separated list of user ids
  type: http
  seq: 1
  tags:
    - Villsource.BuzMag.Api

http:
  method: GET
  url: "{{baseUrl}}/api/v1/realtime/presence"
  params:
    - name: userIds
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
