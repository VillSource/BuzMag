info:
  name: Restore a soft-deleted ticket
  type: http
  seq: 4
  tags:
    - Tickets

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tickets/:ticketId/restore"
  params:
    - name: ticketId
      value: ""
      type: path
