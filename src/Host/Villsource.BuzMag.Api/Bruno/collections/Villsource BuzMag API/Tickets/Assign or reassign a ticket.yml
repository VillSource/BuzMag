info:
  name: Assign or reassign a ticket
  type: http
  seq: 5
  tags:
    - Tickets

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tickets/:ticketId/assign"
  params:
    - name: ticketId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "assigneeUserId": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

