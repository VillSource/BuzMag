info:
  name: Edit a ticket's title, description, and priority
  type: http
  seq: 11
  tags:
    - Tickets

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/tickets/:ticketId"
  params:
    - name: ticketId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "title": "",
        "description": "",
        "priority": "Low"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/tickets/:ticketId"
      method: PUT
      params:
        - name: ticketId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "title": "",
            "description": "",
            "priority": "Low"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
