info:
  name: Mint a presigned PUT URL for a file upload
  type: http
  seq: 1
  tags:
    - Files

http:
  method: POST
  url: "{{baseUrl}}/api/v1/files/upload-url"
  body:
    type: json
    data: |-
      {
        "ownerType": "",
        "ownerId": "",
        "fileName": "",
        "contentType": "",
        "sizeBytes": "",
        "visibility": "Public",
        "category": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/files/upload-url"
      method: POST
      body:
        type: json
        data: |-
          {
            "ownerType": "",
            "ownerId": "",
            "fileName": "",
            "contentType": "",
            "sizeBytes": "",
            "visibility": "Public",
            "category": ""
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
