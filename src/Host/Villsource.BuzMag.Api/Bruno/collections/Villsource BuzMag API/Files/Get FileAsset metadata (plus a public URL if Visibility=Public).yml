info:
  name: Get FileAsset metadata (plus a public URL if Visibility=Public)
  type: http
  seq: 9
  tags:
    - Files

http:
  method: GET
  url: "{{baseUrl}}/api/v1/files/:id"
  params:
    - name: id
      value: ""
      type: path
