info:
  name: Flip a file's visibility (Public ↔ Private)
  type: http
  seq: 8
  tags:
    - Files

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/files/:id/visibility"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "visibility": "Public"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/files/:id/visibility"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "visibility": "Public"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "ownerType": "",
            "ownerId": "",
            "originalFileName": "",
            "contentType": "",
            "sizeBytes": "",
            "visibility": "Public",
            "status": "PendingUpload",
            "scanStatus": "",
            "createdAtUtc": "",
            "publicUrl": "",
            "createdByUserId": "",
            "deletedOnUtc": "",
            "deletedBy": ""
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/files/:id/visibility"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "visibility": "Public"
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/api/v1/files/:id/visibility"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "visibility": "Public"
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/api/v1/files/:id/visibility"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "visibility": "Public"
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Authenticated upload permission gates the HTTP surface; per-file authorization is delegated to the OwnerType's IFileAccessPolicy (uploader-only by default).
