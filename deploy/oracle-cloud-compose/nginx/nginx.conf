events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream buzmag_api {
    server api:8080;
  }

  upstream buzmag_admin {
    server admin:80;
  }

  upstream buzmag_dashboard {
    server dashboard:80;
  }

  server {
    listen 80;
    server_name api.buzmag.villsource.net;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name api.buzmag.villsource.net;

    client_max_body_size 100m;

    ssl_certificate /etc/nginx/certs/live/buzmag.villsource.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/buzmag.villsource.net/privkey.pem;

    location / {
      proxy_pass http://buzmag_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Fixed: pass through the real upgrade request instead of hardcoding it,
      # so non-WebSocket requests (e.g. /negotiate) aren't mistaken for upgrades
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_cache_bypass "upgrade";
    }
  }

  server {
    listen 80;
    server_name admin.buzmag.villsource.net;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name admin.buzmag.villsource.net;

    ssl_certificate /etc/nginx/certs/live/buzmag.villsource.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/buzmag.villsource.net/privkey.pem;

    location / {
      proxy_pass http://buzmag_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 80;
    server_name buzmag.villsource.net;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name buzmag.villsource.net;

    ssl_certificate /etc/nginx/certs/live/buzmag.villsource.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/buzmag.villsource.net/privkey.pem;

    location / {
      proxy_pass http://buzmag_dashboard;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
}