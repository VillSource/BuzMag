events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream buzmag_api {
    server api:8080;
  }

  upstream buzmag_admin {
    server admin:80;
  }

  upstream buzmag_dashboard {
    server dashboard:80;
  }

  server {
    listen 80;
    server_name api.buzmag.villsource.net;

    client_max_body_size 100m;

    location / {
      proxy_pass http://buzmag_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 80;
    server_name admin.buzmag.villsource.net;

    location / {
      proxy_pass http://buzmag_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name buzmag.villsource.net;

    location / {
      proxy_pass http://buzmag_dashboard;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
  
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
}